<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hopp cards</title>
    <script>
      // Apply the saved theme before the first paint so the window doesn't flash
      (function () {
        const saved = localStorage.getItem("hopp-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", saved === "dark" || (saved !== "light" && prefersDark));
      })();
    </script>
  </head>

  <body class="call-alert-body">
    <div id="root"></div>
    <script type="module" src="/src/windows/cards/main.tsx"></script>
  </body>
</html>
