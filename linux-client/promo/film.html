<!doctype html>
<!-- Hopp for Omarchy promo. Every frame is a pure function of time: render(t) sets the
     whole scene, so render.mjs can capture it frame by frame. Open with ?t=12.3 to preview. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050508;
  font-family:"Adwaita Sans",sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
.mono{font-family:"Iosevka Nerd Font Mono",monospace}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.abs{position:absolute}
#wall{position:absolute;left:-60px;top:-60px;width:2040px;height:1200px;background:#000}
#wall img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.ws{position:absolute;left:0;top:0;width:1920px;height:1080px}

/* Hyprland windows */
.win{position:absolute;border:2px solid var(--mut);background:var(--bg);overflow:hidden}
.win.on{border-color:var(--acc)}
.win.glass{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px)}
.win.glass .lg .box .ti{background:transparent}
.code{font:14px/21px "Iosevka Nerd Font Mono",monospace;padding-top:8px}
.ln{white-space:pre}.ln .n{display:inline-block;width:46px;text-align:right;padding-right:14px;color:var(--mut)}
.ln.cur{background:var(--sel)}.ln.cur .n{color:var(--acc)}
.k{color:var(--mag)}.t{color:var(--yel)}.f{color:var(--acc)}.num{color:var(--org)}.s{color:var(--grn)}
.c{color:var(--dim);font-style:italic}.m{color:var(--cyn)}.p{color:var(--cyn)}.self{color:var(--red)}
.nvstatus{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--bgd);display:flex;
  font:12px/22px "Iosevka Nerd Font Mono",monospace;color:var(--dim)}
.nvstatus b{background:var(--acc);color:var(--bgdd);padding:0 10px}
.nvstatus span{padding:0 10px}.nvstatus .r{margin-left:auto}
.chrome-tabs{height:36px;background:var(--bgdd);display:flex;align-items:flex-end;padding-left:8px}
.chrome-tab{height:30px;padding:0 16px;background:var(--bg);border-radius:8px 8px 0 0;font-size:12.5px;line-height:30px;color:var(--fg);width:300px;white-space:nowrap;overflow:hidden}
.urlbar{height:38px;background:var(--bg);display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--bgl)}
.urlbar div{flex:1;height:26px;border-radius:13px;background:var(--bgd);font:12.5px/26px "Adwaita Sans";color:var(--dim);padding-left:14px}
.urlbar b{color:var(--fg);font-weight:400}
.gh{padding:28px 34px;color:var(--fg)}
.gh h1{font-size:26px;font-weight:500;margin:0 0 10px;color:var(--br)}.gh h1 span{color:var(--dim);font-weight:300}
.gh .badge{display:inline-block;background:var(--grn);color:var(--bgdd);border-radius:14px;padding:4px 12px;font-size:13px;font-weight:600;margin-right:8px}
.gh .meta{font-size:13px;color:var(--dim)}
.gh .tabsrow{display:flex;gap:26px;border-bottom:1px solid var(--bgl);margin:22px 0 18px;font-size:13.5px;color:var(--dim);padding-bottom:10px}
.gh .tabsrow .on{color:var(--br);border-bottom:2px solid var(--org);padding-bottom:9px;margin-bottom:-11px}
.diff{border:1px solid var(--bgl);border-radius:8px;overflow:hidden;font:12.5px/20px "Iosevka Nerd Font Mono",monospace}
.diff .hd{background:var(--bgd);padding:8px 12px;color:var(--fg);border-bottom:1px solid var(--bgl)}
.diff .l{white-space:pre;padding:0 12px}
.diff .a{background:color-mix(in srgb,var(--grn) 14%,transparent);color:var(--fg)}
.diff .d{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--fg)}
.diff .x{color:var(--dim)}
.lg{display:grid;grid-template-columns:400px 1fr;grid-template-rows:repeat(4,auto) 1fr;gap:6px;padding:6px;height:100%;font:13px/20px "Iosevka Nerd Font Mono",monospace}
.lg .box{border:1px solid var(--mut);border-radius:6px;padding:10px 10px 6px;position:relative;color:var(--fg)}
.lg .box.on{border-color:var(--grn)}
.lg .box .ti{position:absolute;top:-10px;left:10px;background:var(--bg);padding:0 4px;color:var(--acc)}
.lg .box.on .ti{color:var(--grn)}
.lg .sel{background:var(--sel);display:block}
.lg .h{color:var(--yel)}.lg .g{color:var(--grn)}.lg .r{color:var(--red)}.lg .d{color:var(--dim)}.lg .b{color:var(--acc)}
.term{padding:14px 16px;font:13.5px/21px "Iosevka Nerd Font Mono",monospace;white-space:pre;color:var(--fg)}
.term .pr{color:var(--grn)}.term .d{color:var(--dim)}.term .g{color:var(--grn)}.term b{color:var(--br)}

/* Top bar (extends upwards so extreme zooms on it never run out of bar) */
#bar{position:absolute;left:0;top:-200px;width:1920px;height:232px;background:color-mix(in srgb,var(--bgdd) 94%,transparent)}
#bar .row{position:absolute;left:0;right:0;bottom:0;height:32px;display:flex;align-items:center;padding:0 16px;
  font:14px "Iosevka Nerd Font Mono",monospace;color:var(--fg)}
#bar .wsn{display:flex;gap:14px}#bar .wsn span{color:var(--dim)}#bar .wsn span.on{color:var(--br)}
#bar .clock{position:absolute;left:50%;transform:translateX(-50%);color:var(--fg)}
#bar .right{margin-left:auto;display:flex;align-items:center;gap:16px}
#hicon{width:18px;height:18px;color:var(--br);display:block}
#pill{display:flex;align-items:center;gap:8px;height:22px;padding:0 10px 0 4px;border-radius:11px;background:var(--bgl);font-size:12.5px;overflow:hidden;white-space:nowrap}
#pill .av{width:16px;height:16px;border-radius:50%;margin-left:-6px;border:1.5px solid var(--bgl);font:700 7px/13px "Adwaita Sans";text-align:center;color:var(--bgdd)}
#pill .av:first-child{margin-left:0}
#pill svg{width:13px;height:13px}

/* Hopp bar panel */
#panel{position:absolute;left:1520px;top:40px;width:390px;border-radius:14px;background:var(--bg);border:1px solid var(--bgl);
  box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;transform-origin:228px 0}
.ph{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.ph .ic{width:36px;height:36px;border-radius:10px;background:var(--bgl);display:grid;place-items:center;color:var(--br)}
.ph .ic svg{width:18px;height:18px}
.ph b{display:block;font-size:15px;font-weight:600;color:var(--br)}.ph small{font-size:12px;color:var(--dim)}
.search{margin:4px 16px 8px;height:38px;border:1px solid var(--bgl);border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--dim);font-size:13.5px}
.search svg{width:15px;height:15px}
.sec{display:flex;justify-content:space-between;padding:12px 16px 6px;font-size:11px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.row2{display:flex;align-items:center;gap:12px;height:50px;padding:0 16px;position:relative}
.row2.sel{background:var(--bgl)}
.row2 .nm{font-size:14px;color:var(--br)}.row2 .st{font-size:12px;color:var(--dim)}
.row2 .hint{margin-left:auto;font:12px "Iosevka Nerd Font Mono",monospace;color:var(--dim);opacity:0}
.ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;position:relative;flex:none}
.ava .dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg)}
.ava .ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--grn);opacity:0}
.room{width:32px;height:32px;border-radius:8px;background:var(--bgl);display:grid;place-items:center;color:var(--dim);flex:none}
.room svg{width:15px;height:15px}
.pfoot{border-top:1px solid var(--bgl);margin-top:6px;padding:12px 16px;display:flex;justify-content:space-between;font:12px "Iosevka Nerd Font Mono",monospace;color:var(--dim)}

/* Incoming call toast (layer shell) */
#toast{position:absolute;left:1550px;top:42px;width:360px;height:96px;border-radius:12px;background:var(--bgd);
  border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 18px 50px rgba(0,0,0,.5);display:flex;gap:14px;padding:14px}
#toast .ava{width:52px;height:52px;font-size:18px;border:2px solid currentColor}
#toast b{font-size:15px;font-weight:600;color:var(--br)}#toast small{display:block;font-size:12px;color:var(--dim);margin:2px 0 8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:7px;font-size:13px;border:1px solid var(--mut);color:var(--fg);margin-right:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bgdd)}
.btn svg{width:14px;height:14px}

/* Faces (call window) */
#faces{position:absolute;border-radius:12px;background:color-mix(in srgb,var(--bgdd) 62%,transparent);
  border:1px solid color-mix(in srgb,var(--br) 10%,transparent);box-shadow:0 20px 50px rgba(0,0,0,.45);transform-origin:100% 100%}
.tile{position:absolute;border-radius:8px;overflow:hidden;background:var(--bgl)}
.tile svg.cam{position:absolute;inset:0;width:100%;height:100%}
.tile .ring{position:absolute;inset:0;border-radius:inherit;border:2.5px solid var(--grn);opacity:0}
.tile .nm{position:absolute;left:5px;bottom:5px;font-size:10.5px;padding:2px 6px;border-radius:5px;background:rgba(10,10,16,.62);color:#e8eaf4;white-space:nowrap}
.tile .bdg{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:6px;background:rgba(10,10,16,.6);display:grid;place-items:center;color:#e8eaf4}
.tile .bdg svg{width:12px;height:12px}
.ctl{position:absolute;width:30px;height:30px;border-radius:8px;background:var(--bgl);display:grid;place-items:center;color:var(--fg)}
.ctl svg{width:15px;height:15px}.ctl.end{background:var(--red);color:var(--bgdd)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Viewer */
.vclip{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;background:var(--bgdd)}
#vimg{position:absolute;left:0;top:0;width:1500px;height:1000px;transform-origin:0 0}
#vimg img{width:1500px;height:1000px;display:block}
.vpill{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:46px;padding:0 8px 0 10px;
  border-radius:12px;background:color-mix(in srgb,var(--bgdd) 78%,transparent);border:1px solid color-mix(in srgb,var(--br) 10%,transparent);
  box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:13px;white-space:nowrap;color:var(--fg)}
.vpill .who b{display:block;font-weight:500;color:var(--br);font-size:13px}.vpill .who small{font-size:10.5px;color:var(--dim)}
.seg{display:flex;border:1px solid var(--bgl);border-radius:7px;overflow:hidden}
.seg span{padding:0 10px;line-height:26px;font-size:12px;color:var(--dim)}.seg span.on{background:var(--bgl);color:var(--br)}
.vbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--bgl);font-size:12.5px;color:var(--fg)}
.vbtn svg{width:13px;height:13px}.vbtn.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc);color:var(--br)}
.mini{position:absolute;right:12px;bottom:12px;width:210px;height:140px;border-radius:8px;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--br) 14%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.5);background:#000}
.mini img{width:100%;height:100%;opacity:.85}
.mini .vr{position:absolute;border:1.5px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:2px}
.mini small{position:absolute;left:6px;bottom:4px;font-size:10px;color:#dfe3f2;text-shadow:0 1px 2px #000}
.rcur{position:absolute;left:0;top:0;pointer-events:none}
.rcur svg{width:22px;height:22px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.rcur span{position:absolute;left:18px;top:18px;font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;color:#11111b;white-space:nowrap}

/* Peek (special:hopp) */
#peekdim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#peek{position:absolute;left:10px;top:42px;width:1900px;height:1028px;border:2px solid var(--acc);overflow:hidden}
#peek .amb{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;
  filter:blur(34px) saturate(1.7) brightness(1.05);opacity:.85}
#peek .sharp{position:absolute;left:180px;top:0;width:1536px;height:1024px;box-shadow:0 0 60px rgba(0,0,0,.55)}
.frost{position:absolute;border-radius:12px;background:color-mix(in srgb,var(--bgdd) 55%,transparent);
  border:1px solid color-mix(in srgb,var(--br) 10%,transparent);box-shadow:0 18px 40px rgba(0,0,0,.35)}
#dockL{left:15px;width:150px;padding:12px 10px;font-size:12px;color:var(--fg)}
#dockL .who{display:flex;gap:8px;align-items:center;margin-bottom:10px}
#dockL .who .ava{width:26px;height:26px;font-size:10px}
#dockL .who b{display:block;font-size:12px;font-weight:500;color:var(--br)}#dockL .who small{font-size:10px;color:var(--dim)}
#dockL .seg{margin-bottom:8px}#dockL .seg span{flex:1;text-align:center;padding:0}
#dockL .vbtn{margin-bottom:6px;font-size:12px}
#dockL .sep{height:1px;background:var(--bgl);margin:10px 0}
#dockL .ctls{display:flex;gap:6px;justify-content:center}
#dockL .ctls .ctl{position:static;width:28px;height:28px}

/* Overlay: type, captions, keycaps */
#overlay{position:absolute;inset:0;pointer-events:none}
.layer{position:absolute;inset:0}
#intro{background:#06060a;overflow:hidden}
.orb{position:absolute;width:1100px;height:1100px;border-radius:50%;filter:blur(120px);opacity:.5}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-weight:900;letter-spacing:-.045em;color:#f4f6ff;line-height:.95}
.wd{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .1em}
.wd>span{display:inline-block}
.kick{font:600 20px "Iosevka Nerd Font Mono",monospace;letter-spacing:.34em;color:var(--acc);text-transform:uppercase}
#cap{position:absolute;left:96px;bottom:96px}
#cap .k{margin-bottom:14px}
#cap .h{font-weight:900;font-size:86px;line-height:.98;letter-spacing:-.035em;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.6)}
#scrim{position:absolute;inset:0;background:radial-gradient(60% 55% at 12% 100%,rgba(4,4,8,.82),rgba(4,4,8,0) 75%)}
#keys{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center;gap:14px}
.key{min-width:76px;height:72px;padding:0 22px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(#2c2f42,#1b1d2a);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 7px 0 #0b0c13,0 18px 40px rgba(0,0,0,.55);font:600 26px "Adwaita Sans";color:#eef1fb}
#themechip{position:absolute;left:96px;bottom:300px;font:600 22px "Iosevka Nerd Font Mono",monospace;letter-spacing:.12em;
  padding:8px 16px;border-radius:10px;background:var(--acc);color:var(--bgdd)}
#cards .kick{font-size:24px;margin-bottom:26px}
.kbig{display:inline-grid;place-items:center;height:124px;min-width:124px;padding:0 38px;border-radius:22px;font:700 52px "Adwaita Sans";letter-spacing:0;color:#eef1fb;
  background:linear-gradient(#2e3248,#1b1d2a);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 0 #0b0c13,0 26px 60px rgba(0,0,0,.6),0 0 60px color-mix(in srgb,var(--red) 25%,transparent)}
#endcard .mark{width:150px;height:150px;color:#f4f6ff}
.sweep{background:linear-gradient(100deg,#f4f6ff 0%,#f4f6ff 40%,#ffffff 48%,var(--acc) 50%,#f4f6ff 56%,#f4f6ff 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}

/* Film finishing */
#fx{position:absolute;inset:0;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#vig{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#grain{position:absolute;inset:0;width:1920px;height:1080px;opacity:.07;mix-blend-mode:overlay;image-rendering:pixelated}
.lbx{position:absolute;left:0;right:0;height:140px;background:#000}
#fade{position:absolute;inset:0;background:#000;opacity:0}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="bk" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="mb" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbf" stdDeviation="0 0"/></filter>
  <filter id="mb2" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbf2" stdDeviation="0 0"/></filter>
  <radialGradient id="tv" cx="50%" cy="45%" r="70%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".45"/></radialGradient>
  <linearGradient id="bg-mira" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#5a3f86"/><stop offset="1" stop-color="#1c1631"/></linearGradient>
  <linearGradient id="bg-jonas" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#5b4334"/><stop offset="1" stop-color="#1d1613"/></linearGradient>
  <linearGradient id="bg-you" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#24426e"/><stop offset="1" stop-color="#0d1426"/></linearGradient>
  <linearGradient id="lite" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs></svg>

<div id="stage">
  <div id="world">
    <div id="wall"></div>
    <div class="ws" id="ws1"></div>
    <div class="ws" id="ws2"></div>
    <div id="peekdim"></div>
    <div id="peek"></div>
    <div id="bar"></div>
    <div id="faces"></div>
    <div id="panel"></div>
    <div id="toast"></div>
  </div>
  <div id="overlay">
    <div id="scrim"></div>
    <div id="cap"><div class="kick k"></div><div class="h"></div></div>
    <div id="themechip"></div>
    <div id="keys"></div>
    <div class="layer" id="cards"></div>
    <div class="layer" id="intro"></div>
    <div class="layer" id="endcard"></div>
  </div>
  <div id="fx">
    <canvas id="grain" width="480" height="270"></canvas>
    <div id="vig"></div>
    <div class="lbx" id="lbt" style="top:0"></div><div class="lbx" id="lbb" style="bottom:0"></div>
    <div id="flash"></div>
    <div id="fade"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- time & easing
const BPM = 128, BEAT = 60 / BPM, BAR = 4 * BEAT, DUR = 25 * BAR;
const T = (bar, beat = 0) => bar * BAR + beat * BEAT;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
};
// Damped spring from 0 to 1, dt in seconds.
const spring = (dt, w = 15, d = 8) => dt <= 0 ? 0 : 1 - Math.exp(-d * dt) * Math.cos(w * dt);
const pulse = (t, at, len = .25) => t < at ? 0 : Math.exp(-(t - at) / len * 3) * (t - at < len * 3 ? 1 : 0);

// Keyframe tracks: [[time, {props}, ease]]; 'z' interpolates in log space.
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [tb, vb, e] = keys[i];
    if (t < tb) {
      const [ta, va] = keys[i - 1];
      const p = E[e || 'inOutCubic']((t - ta) / (tb - ta));
      const o = {};
      for (const k in vb) o[k] = k === 'z' ? Math.exp(lerp(Math.log(va[k]), Math.log(vb[k]), p)) : lerp(va[k], vb[k], p);
      return o;
    }
  }
  return keys[keys.length - 1][1];
}

const memo = new WeakMap();

function voice(id, t) {
  for (const [w, a, b] of TALK) if (w === id && t >= a && t < b) {
    const s = PEOPLE[id].seed, v = Math.abs(Math.sin(t * 17 + s) * Math.sin(t * 6.3 + s * 3) + .35 * Math.sin(t * 31 + s));
    const words = Math.sin(t * 3.1 + s) > -.55 ? 1 : .15;
    return clamp(v * words * prog(t, a, a + .15) * (1 - prog(t, b - .15, b)), 0, 1);
  }
  return 0;
}
const speaking = (id, t) => TALK.some(([w, a, b]) => w === id && t >= a + .1 && t < b);
function animatePeople(t) {
  for (const id in PEOPLE) {
    const s = PEOPLE[id].seed, v = voice(id, t);
    const bx = Math.sin(t * .9 + s) * 1.6 + Math.sin(t * 2.3 + s * 2) * .4, by = Math.sin(t * 1.3 + s) * .8;
    const rot = Math.sin(t * .8 + s * 1.7) * 3 + v * Math.sin(t * 9 + s) * 1.5;
    const blinkPhase = (t + s * 1.9) % 3.6, blink = blinkPhase < .14 ? Math.max(.12, Math.abs(blinkPhase - .07) / .07) : 1;
    for (const svg of document.querySelectorAll(`svg.cam[data-p="${id}"]`)) {
      A(svg.querySelector('.body'), 'transform', `translate(${f2(bx)} ${f2(by)})`);
      A(svg.querySelector('.head'), 'transform', `rotate(${f2(rot)} 50 62) translate(0 ${f2(-v * .6)})`);
      A(svg.querySelector('.eyes'), 'transform', `translate(0 45.5) scale(1 ${f2(blink)}) translate(0 -45.5)`);
      A(svg.querySelector('.mouth'), 'ry', f2(.9 + v * 2.6));

}

// ---------------------------------------------------------------- syntax highlight
function hl(line) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  if (/^\s*\/\//.test(line)) return `<span class="c">${esc(line)}</span>`;
  const rules = [[/^#\[[^\]]*\]/, 'm'], [/^\s+/, null], [/^"[^"]*"/, 's'], [/^\d+(\.\d*)?/, 'num'], [/^self\b/, 'self'],
    [/^(pub|fn|let|mut|if|else|as|impl|for|return|struct|enum|use|mod|match|const)\b/, 'k'], [/^[a-z_][a-z0-9_]*!/, 'm'],
    [/^[a-z_][a-z0-9_]*(?=\()/, 'f'], [/^[A-Z][A-Za-z0-9_]*/, 't'], [/^(u32|f32|usize)\b/, 't'], [/^[a-z_][a-z0-9_]*/, null],
    [/^(->|=>|&|::|\|)/, 'p'], [/^./, null]];
  let out = '', rest = line;
  while (rest.length) for (const [re, cls] of rules) {
    const m = rest.match(re); if (!m) continue;
    out += cls ? `<span class="${cls}">${esc(m[0])}</span>` : esc(m[0]); rest = rest.slice(m[0].length); break;
  }
  return out;
}

pub fn window_size(people: usize, layout: FaceLayout, face: FaceSize) -> Size<f32> {
    let people = people.max(1) as f32;
    let tile = tile_side(layout, face);
    let strip = people * tile + (people - 1.) * GAP;
    let grid = 2. * CONTROL + CONTROL_GAP;
    match layout {

                CONTROL
            } else {
                grid
            };
            Size {
                width: tile.max(grid) + 2. * PAD,
                height: strip + GAP + controls + 2. * PAD,
            }
        }
        FaceLayout::Row => Size {
            width: strip + GAP + grid + 2. * PAD,
            height: tile.max(grid) + 2. * PAD,
        },
    }
}

pub fn toggle_peek(cx: &mut App) {
    if let Some(handle) = cx.global_mut::<Shell>().peek.take() {
        let _ = handle.update(cx, |_, window, _| window.remove_window());
        Self::set_docked(true, false, cx);
    } else {
        Self::show_peek(cx);
    }
}`;

      <div id="e-tag" style="font-size:44px;font-weight:600;color:#e6e9f7;margin-top:46px;letter-spacing:-.01em">Pair like you’re in the same room.</div>
      <div class="mono" id="e-url" style="font-size:26px;color:#9aa5ce;margin-top:22px;letter-spacing:.04em">github.com/gethopp/hopp</div></div>`;
  }
  // Mark flies in from far away during the riser, lands on the drop.
  const fly = E.inExpo(prog(t, T(21, 2), T(22)));
  const land = E.outExpo(prog(t, T(22), T(22, 1.5)));
  const mark = $('#e-mark');
  S(mark, 'transform', t < T(22) ? `translateX(${f2(170)}px) scale(${f2(.05 + fly * 1.4)})` : `translateX(${f2(170 * (1 - land))}px) scale(${f2(1.45 - .45 * land)})`);
  S(mark, 'filter', `drop-shadow(0 0 ${f2(30 + 40 * pulse(t, T(22), .6))}px color-mix(in srgb,var(--acc) 75%,transparent))`);
  S(mark, 'opacity', f2(Math.min(1, fly * 3 + (t >= T(22) ? 1 : 0))));
  const w = $('#e-word'), wp = E.outExpo(prog(t, T(22, .3), T(22, 1.4)));
  S(w, 'opacity', f2(wp)); S(w, 'transform', `translateX(${f2((1 - wp) * 80)}px)`); S(w, 'filter', `blur(${f2((1 - wp) * 20)}px)`);
  S(w, 'backgroundPosition', `${f2(lerp(100, 0, E.inOutCubic(prog(t, T(22, 1.5), T(23, 1)))))}% 0`);
  const sp = E.outExpo(prog(t, T(22, 1.2), T(22, 2.2)));
  S($('#e-sub'), 'opacity', f2(sp)); S($('#e-sub'), 'letterSpacing', `${f2(.6 - .26 * sp)}em`);
  const tp = E.outExpo(prog(t, T(22, 2.5), T(23, .5)));
  S($('#e-tag'), 'opacity', f2(tp)); S($('#e-tag'), 'transform', `translateY(${f2((1 - tp) * 24)}px)`); S($('#e-tag'), 'filter', `blur(${f2((1 - tp) * 10)}px)`);
  const up = E.outExpo(prog(t, T(23, 1), T(23, 2)));
  S($('#e-url'), 'opacity', f2(up * .9));
  S($('#e-row'), 'opacity', t < T(22) ? '1' : '1');
}

// ---------------------------------------------------------------- boot
build();
window.DUR = DUR; window.BAR = BAR;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  applyTheme('tokyo night');
  // Measure the bar icon so the intro mark lands exactly on it.
  const r = $('#hicon').getBoundingClientRect(), s = $('#world').getBoundingClientRect();
  HX = r.left + r.width / 2 - s.left; HY = r.top + r.height / 2 - s.top;
  window.render = render;
  const q = new URLSearchParams(location.search);
  render(q.has('t') ? parseFloat(q.get('t')) : 0);
  return true;
})();
</script>
