[package]
name = "hopp"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Hopp for Omarchy: native pair programming client for Linux"

[workspace]
members = [".", "transcribe"]

[dependencies]
anyhow = "1"
log = "0.4"
uuid = { version = "1", features = ["v5"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = "=0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
wayland-client = "0.31"
wayland-protocols-hyprland = { version = "1.2", features = ["client"] }
zbus = { version = "5", features = ["blocking-api"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "screencast"] }
pipewire = "=0.10.1"
image = "0.25"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
futures-util = "0.3"
cpal = "=0.17.3"
# The ALSA PipeWire plugin, for PipeWire sources cpal does not list (pipewire_audio).
alsa = "0.11"
livekit = { git = "https://github.com/livekit/rust-sdks", rev = "2dd762da4fdc8b73504983aff078d7824ea5d4ee", features = ["rustls-tls-native-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
tempfile = "3"
v4l = "0.14"
webp = { version = "0.3", default-features = false }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.release.package.gpui-pre-macros]
debug-assertions = true

[patch.'https://github.com/livekit/rust-sdks']
webrtc-sys = { path = "vendor/webrtc-sys" }

# GPUI's wgpu renderer with one fix: a frame that names atlas textures cleared after GPU
# errors skips them and repaints, instead of panicking ("texture must exist"). That panic
# crashed Hopp mid-call on 3 November. See vendor/gpui-pre-wgpu (search "Hopp patch").
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
