[package]
name = "webrtc-sys"
version = "0.3.47"
edition = "2021"
homepage = "https://livekit.io"
license = "Apache-2.0"
description = "Unsafe bindings to libwebrtc"
repository = "https://github.com/livekit/rust-sdks"

[features]
default = []

# How CI checks this crate's features, read by
# `.github/workflows/feature-combinations-curated.yml` via `cargo metadata`.
[package.metadata.feature-combinations]
mode = "powerset"

[dependencies]
cxx = "1.0"
log = "0.4"

[build-dependencies]
webrtc-sys-build = { git = "https://github.com/livekit/rust-sdks", rev = "2dd762da4fdc8b73504983aff078d7824ea5d4ee" }
cxx-build = "1.0"
glob = "0.3"
cc = { version = "1.0", features = ["parallel"] }
pkg-config = "0.3.22"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.22"
