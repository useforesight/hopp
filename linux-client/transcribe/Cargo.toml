[package]
name = "hopp-transcribe"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Hopp's transcription helper: transcribe.cpp (Parakeet, Whisper) in a process of its own"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same engine and version as Hex, so its models and fixes carry over.
transcribe-cpp = { version = "=0.2.4", features = ["vulkan"] }
