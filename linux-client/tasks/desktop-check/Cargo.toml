[package]
name = "hopp-native-editor"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = "=0.1.3"
serde_json = "1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
tempfile = "3"

[[bin]]
name = "hopp-private-input"
path = "src/private_input.rs"

[profile.dev]
debug = "limited"

[lints.rust]
unsafe_code = "forbid"
