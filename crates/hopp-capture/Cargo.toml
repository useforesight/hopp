[package]
name = "hopp-capture"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Capture: a transcript of a call, one track per person, saved only on this computer"

[features]
# The call's audio is 16 kHz on the Mac and 48 kHz on Linux. See `vad::RATE`.
rate-48k = []

[[bin]]
name = "hopp"
path = "src/bin/hopp.rs"

[dependencies]
hopp-marks = { path = "../hopp-marks" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
webp = { version = "0.3", default-features = false }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
