name: "Build Hopp Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.0.33)"
        required: true
        type: string
      release_name:
        description: "Release name"
        required: false
        default: "Hopp Release"
        type: string
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string
      from_ref:
        description: "Previous release tag/SHA to diff from (auto-detected if empty)"
        required: false
        default: ""
        type: string

jobs:
  prepare-notes:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.collect.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve git-cliff args
        id: cliff_args
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.from_ref }}" ]]; then
            echo "args=--tag ${{ github.event.inputs.version }} --strip header ${{ github.event.inputs.from_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "args=--unreleased --tag ${{ github.event.inputs.version }} --strip header" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.cliff_args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: CHANGES.md

      - name: Expose notes as job output
        id: collect
        shell: bash
        run: |
          {
            echo "notes<<HOPP_EOF"
            cat "${{ steps.cliff.outputs.changelog }}"
            echo "HOPP_EOF"
          } >> "$GITHUB_OUTPUT"

  # Build for all platforms using matrix strategy
  build-release:
    needs: prepare-notes
    permissions:
      contents: write
    environment: Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target x86_64-apple-darwin --config src-tauri/tauri.conf.rel.json --config src-tauri/tauri.conf.rel.macos.json"
            target: "x86_64-apple-darwin"
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin --config src-tauri/tauri.conf.rel.json --config src-tauri/tauri.conf.rel.macos.json"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc --config src-tauri/tauri.conf.rel.json"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install Yarn
        run: corepack prepare yarn@stable --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Task (go-task)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install go-task/tap/go-task
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install go-task
          else
            # Linux
            sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          fi

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        shell: bash
        run: |
          yarn install

      - name: Map target to OS/ARCH for Task
        shell: bash
        id: task_vars
        run: |
          # Map from Rust target triple to task format
          case "${{ matrix.target }}" in
            "aarch64-apple-darwin")
              echo "task_os=mac" >> $GITHUB_OUTPUT
              echo "task_arch=arm64" >> $GITHUB_OUTPUT
              ;;
            "x86_64-apple-darwin")
              echo "task_os=mac" >> $GITHUB_OUTPUT
              echo "task_arch=x64" >> $GITHUB_OUTPUT
              ;;
            "x86_64-pc-windows-msvc")
              echo "task_os=win" >> $GITHUB_OUTPUT
              echo "task_arch=x64" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "task_os=linux" >> $GITHUB_OUTPUT
              echo "task_arch=x64" >> $GITHUB_OUTPUT
              ;;
          esac

      # Self-signed, as this repo has no Apple Developer account. Builds aren't notarized, so
      # install.sh is how people get past Gatekeeper. A stable certificate keeps macOS permissions
      # across updates. macOS doesn't trust the certificate, so Tauri only gets its identity and
      # signs from this keychain.
      - name: Import signing certificate
        if: matrix.platform == 'macos-26'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_SIGNING_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Set signing identity
        if: matrix.platform == 'macos-26'
        run: |
          CERT_ID=$(security find-identity -p codesigning build.keychain | awk '/^ *1\)/ {print $2; exit}')
          if [[ -z "$CERT_ID" ]]; then
            echo "::error::The signing certificate wasn't imported"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV

      - name: Run core:release task
        shell: bash
        run: |
          cd core
          task release OS=${{ steps.task_vars.outputs.task_os }} ARCH=${{ steps.task_vars.outputs.task_arch }}

      # Transcribes captured calls in a process of its own. Bundled like the core, which also
      # gets it signed.
      - name: Build the transcription helper
        if: matrix.platform == 'macos-26'
        shell: bash
        run: |
          cd crates/hopp-transcribe
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/hopp-transcribe ../../core/target/release/hopp-transcribe-${{ matrix.target }}

      - name: Set Vite environment variables
        shell: bash
        id: vite_vars
        run: |
          # Set VITE_BOTTOM_ARROW based on platform (true for Windows, false for others)
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            echo "vite_bottom_arrow=true" >> $GITHUB_OUTPUT
            echo "vite_os=windows" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.target }}" == *"linux"* ]]; then
            echo "vite_bottom_arrow=false" >> $GITHUB_OUTPUT
            echo "vite_os=linux" >> $GITHUB_OUTPUT
          else
            echo "vite_bottom_arrow=false" >> $GITHUB_OUTPUT
            echo "vite_os=macos" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_BOTTOM_ARROW: ${{ steps.vite_vars.outputs.vite_bottom_arrow }}
          VITE_OS: ${{ steps.vite_vars.outputs.vite_os }}
          SENTRY_DSN_RUST: ${{ secrets.SENTRY_DSN_RUST }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN_JS: ${{ secrets.VITE_SENTRY_DSN_JS }}
          # Stock Hopp's server. People on their own server set it once in Settings, and updates
          # keep it, so no private address ends up in this public repo or its builds.
          VITE_API_BASE_URL: pair.gethopp.app
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        with:
          projectPath: tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.version }}
          releaseName: "${{ github.event.inputs.release_name }} ${{ github.event.inputs.version }}"
          releaseBody: ${{ needs.prepare-notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          updaterJsonKeepUniversal: false

      - name: Zip Windows MSI for browser-safe download
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msi = Get-ChildItem -Path "tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter "hopp_*_x64_en-US.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          $zip = Join-Path $env:RUNNER_TEMP "hopp_x64_en-US.msi.zip"
          Compress-Archive -Path $msi.FullName -DestinationPath $zip -Force
          gh release upload "${{ github.event.inputs.version }}" $zip --clobber --repo "$env:GITHUB_REPOSITORY"
